name: 'Main/Release CI/CD'
on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      publish_packages:
        description: Publish affected public packages to the Incursa feed and NuGet.org
        required: true
        default: false
        type: boolean
      base_ref:
        description: Optional base commit/ref for affected-package selection (defaults to HEAD^)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke lane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore Incursa.Integrations.Public.CI.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build Incursa.Integrations.Public.CI.slnx --no-restore --configuration Release

      - name: Run smoke lane
        shell: pwsh
        run: pwsh -File scripts/quality/run-smoke-tests.ps1 -NoRestore -NoBuild

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-lane-artifacts
          path: artifacts/codex/test-results/smoke/

  blocking:
    name: Blocking lane
    runs-on: ubuntu-latest
    needs: smoke
    outputs:
      has_packages: ${{ steps.package_selection.outputs.has_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore Incursa.Integrations.Public.CI.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Fetch main for affected package diff
        run: git fetch origin main --depth=1

      - name: Determine diff base
        id: diff_base
        shell: pwsh
        run: |
          $baseRef = "${{ github.event.before }}".Trim()
          $zeroSha = "0000000000000000000000000000000000000000"

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $requestedBase = "${{ inputs.base_ref }}".Trim()
            $baseRef = if ([string]::IsNullOrWhiteSpace($requestedBase)) {
              (git rev-parse HEAD^).Trim()
            }
            else {
              (git rev-parse $requestedBase).Trim()
            }
          }
          elseif ([string]::IsNullOrWhiteSpace($baseRef) -or $baseRef -eq $zeroSha) {
            $baseRef = (git merge-base origin/main HEAD).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($baseRef)) {
            throw "Could not resolve a diff base for package version validation."
          }

          echo "mergeBase=$baseRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate package version bumps
        shell: pwsh
        run: pwsh -File eng/Test-PackageVersionChanges.ps1 -Base "${{ steps.diff_base.outputs.mergeBase }}" -Head HEAD

      - name: Build solution
        run: dotnet build Incursa.Integrations.Public.CI.slnx --no-restore --configuration Release

      - name: Run blocking lane
        shell: pwsh
        run: pwsh -File scripts/quality/run-blocking-tests.ps1 -NoRestore -NoBuild

      - name: Regenerate package catalog
        shell: pwsh
        run: pwsh -File eng/Generate-PackageCatalog.ps1

      - name: Pack publishable packages
        shell: pwsh
        run: pwsh -File eng/Pack-PublicPackages.ps1 -Configuration Release -OutputPath ./nupkgs -PublishableOnly -AffectedOnly -Base "${{ steps.diff_base.outputs.mergeBase }}" -Head HEAD

      - name: Record approved package selection
        id: package_selection
        shell: pwsh
        run: |
          $selection = pwsh -File eng/Get-AffectedPackageIds.ps1 -Base "${{ steps.diff_base.outputs.mergeBase }}" -Head HEAD
          $packageIds = @($selection | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($packageIds.Count -eq 0) {
            "has_packages=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            return
          }

          $packageIds | Set-Content -LiteralPath ./nupkgs/expected-package-ids.txt
          "has_packages=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        if: ${{ steps.package_selection.outputs.has_packages == 'true' }}
        with:
          name: nupkgs
          if-no-files-found: error
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/expected-package-ids.txt

      - name: Upload blocking artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blocking-lane-artifacts
          path: artifacts/codex/test-results/blocking/

  observational:
    name: Observational lane
    runs-on: ubuntu-latest
    needs: smoke
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore Incursa.Integrations.Public.CI.slnx

      - name: Build solution
        run: dotnet build Incursa.Integrations.Public.CI.slnx --no-restore --configuration Release

      - name: Run observational lane
        shell: pwsh
        run: pwsh -File scripts/quality/run-observational-tests.ps1 -NoRestore -NoBuild

      - name: Upload observational artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observational-lane-artifacts
          path: artifacts/codex/test-results/observational/

  advisory:
    name: Advisory quality lane
    runs-on: ubuntu-latest
    needs: smoke
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore Incursa.Integrations.Public.CI.slnx

      - name: Restore tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build Incursa.Integrations.Public.CI.slnx --no-restore --configuration Release

      - name: Run advisory quality evidence
        shell: pwsh
        run: pwsh -File scripts/quality/run-quality-evidence.ps1 -NoRestore -NoBuild

      - name: Upload advisory artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisory-quality-artifacts
          path: |
            artifacts/codex/test-results/advisory/
            artifacts/codex/coverage/advisory/
            artifacts/quality/testing/

  publish-public-nuget:
    needs: blocking
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_packages && needs.blocking.outputs.has_packages == 'true' }}
    environment: public-nuget-publish
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: out

      - name: Read approved package IDs
        id: package_ids
        shell: bash
        run: |
          echo 'value<<PACKAGE_IDS' >> "$GITHUB_OUTPUT"
          cat out/expected-package-ids.txt >> "$GITHUB_OUTPUT"
          echo 'PACKAGE_IDS' >> "$GITHUB_OUTPUT"

      - name: Publish to both public feeds
        uses: incursa/public-workflows/.github/actions/publish-nuget-dual@9cdb2cc0c9a35781d7424a29b05dd72c87f813bf
        with:
          packages-directory: out
          expected-package-ids: ${{ steps.package_ids.outputs.value }}
          github-token: ${{ github.token }}
          incursa-api-key: ${{ secrets.NUGET_INCURSA_PUBLIC_PUBLISH_TOKEN }}
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}

      - name: Upload publication manifest
        uses: actions/upload-artifact@v4
        with:
          name: public-nuget-publication-manifest
          if-no-files-found: error
          path: out/publication-manifest.json
